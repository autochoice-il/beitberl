<title>בית ברל – העוזר הדיגיטלי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --green:#24725c; --green-dark:#1a5544; --ink:#1d2b26; --paper:#f5f8f6; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Heebo',Arial,sans-serif; background:var(--paper); color:var(--ink); min-height:100vh; }
  header { background:var(--green); color:#fff; padding:20px 16px; }
  .wrap { max-width:880px; margin:0 auto; }
  header .wrap { display:flex; align-items:center; gap:14px; }
  header img { height:44px; }
  header h1 { font-size:20px; font-weight:500; margin:0; }
  main .wrap { padding:40px 16px; }
  h2 { font-size:30px; margin:0 0 12px; color:var(--green-dark); }
  p { font-size:17px; line-height:1.7; margin:0 0 24px; max-width:60ch; }
  .chips { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:28px; }
  .chip { border:1px solid var(--green); color:var(--green); background:#fff; border-radius:999px; padding:8px 16px; font:inherit; font-size:15px; cursor:pointer; }
  .chip:hover { background:var(--green); color:#fff; }
  .contact { font-size:15px; color:#4a5a54; border-top:1px solid #d7e2dd; padding-top:20px; }
  .contact a { color:var(--green); }
</style>
</head>

<header><div class="wrap">
  <img src="https://www.beitberl.ac.il/wp-content/uploads/2025/05/Frame-50-1.svg" alt="המכללה האקדמית בית ברל">
  <h1>העוזר הדיגיטלי</h1>
</div></header>
<main><div class="wrap">
  <h2>שלום, איך אפשר לעזור?</h2>
  <p>שאלו על תוכניות לימוד, תנאי קבלה, הרשמה, שכר לימוד ומלגות. אפשר גם להשאיר פרטים ויועץ לימודים יחזור אליכם.</p>
  <div class="chips">
    <button class="chip" data-q="תואר ראשון">תואר ראשון</button>
    <button class="chip" data-q="תואר שני">תואר שני</button>
    <button class="chip" data-q="הסבה להוראה">הסבה להוראה</button>
    <button class="chip" data-q="מה תנאי הקבלה?">תנאי קבלה</button>
    <button class="chip" data-q="אני רוצה שיחזרו אליי">השארת פרטים</button>
  </div>
  <div class="contact">מרכז ייעוץ והרשמה: <a href="tel:097476333">9121*</a> · <a href="https://www.beitberl.ac.il/" target="_blank" rel="noopener">לאתר המכללה</a></div>
</div></main>
